<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save image as PNG</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="container">
      <header>
        <h1 data-i18n="popupHeading">Save image as PNG</h1>
      </header>

      <form id="mode-form" class="mode-select">
        <label class="radio-label" for="mode-instant">
          <input type="radio" id="mode-instant" name="saveMode" value="instant">
          <span class="custom-radio"></span>
          <div class="label-text">
            <strong data-i18n="modeInstantTitle">Save instantly</strong>
            <span data-i18n="modeInstantDescription">Save to the downloads folder without confirmation.</span>
          </div>
        </label>

        <label class="radio-label" for="mode-prompt">
          <input type="radio" id="mode-prompt" name="saveMode" value="prompt">
          <span class="custom-radio"></span>
          <div class="label-text">
            <strong data-i18n="modePromptTitle">Choose location</strong>
            <span data-i18n="modePromptDescription">Pick a destination each time with a dialog.</span>
          </div>
        </label>
      </form>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
