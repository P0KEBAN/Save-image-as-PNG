<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save image as PNG</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Save image as PNG</h1>
      </header>

      <form id="mode-form" class="mode-select">
        <label class="radio-label" for="mode-instant">
          <input type="radio" id="mode-instant" name="saveMode" value="instant">
          <span class="custom-radio"></span>
          <div class="label-text">
            <strong>即保存</strong>
            <span>確認なしでダウンロードフォルダへ保存</span>
          </div>
        </label>

        <label class="radio-label" for="mode-prompt">
          <input type="radio" id="mode-prompt" name="saveMode" value="prompt">
          <span class="custom-radio"></span>
          <div class="label-text">
            <strong>保存先を選択</strong>
            <span>都度ダイアログで保存先を指定</span>
          </div>
        </label>
      </form>

      <footer class="footer">
        <span id="status-text"></span>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
